<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-Lens Self Portrait Studio - Bookings</title>
    <!-- Tailwind CSS CDN para sa mabilis at malinis na styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800 min-f-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-8 border border-stone-200">
        <h1 class="text-3xl font-bold text-center text-stone-900 mb-2">B-Lens Self Portrait Studio</h1>
        <p class="text-center text-stone-500 mb-6 text-sm">Fill out the details below to secure your preferred time slot.</p>

        <form action="/save-booking" method="POST" enctype="multipart/form-data" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-1">Date of Shoot:</label>
                <!-- Ginamitan ng id="datePicker" para ma-apply ang JavaScript restriction -->
                <input type="date" id="datePicker" name="date" required
                    class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-1">Available Time Slot:</label>
                <select id="timeSlotSelect" name="schedule" required
                    class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-500 focus:outline-none">
                    <option value="">-- Select a date first --</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-1">Full Name:</label>
                <input type="text" name="customer_name" placeholder="e.g. Juan Dela Cruz" required
                    class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-1">Contact Number:</label>
                <input type="text" name="contact_no" placeholder="e.g. 09123456789" required
                    class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-1">Email Address:</label>
                <input type="email" name="email" placeholder="example@gmail.com" required
                    class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-1">Social Media Account (FB/IG Profile):</label>
                <input type="text" name="social_media" placeholder="e.g. facebook.com/juandelacruz" required
                    class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-stone-500 focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-stone-900 text-white font-semibold py-3 rounded-lg hover:bg-stone-800 transition duration-200">
                Proceed with Booking
            </button>
        </form>
    </div>

    <script>
        // 1. I-set ang minimum date sa kasalukuyang araw para mai-gray out ang mga nakaraang petsa sa kalendaryo
        const todayStr = new Date().toISOString().split('T')[0];
        const datePicker = document.getElementById('datePicker');
        datePicker.setAttribute('min', todayStr);

        // 2. Kunin ang mga available time slots kapag nagbago ang piniling petsa
        datePicker.addEventListener('change', function() {
            const selectedDate = this.value;
            const slotSelect = document.getElementById('timeSlotSelect');

            if (!selectedDate) return;

            slotSelect.innerHTML = '<option value="">Loading slots...</option>';

            fetch(`/get-slots?date=${selectedDate}`)
                .then(response => response.json())
                .then(data => {
                    slotSelect.innerHTML = '';
                    if (data.slots && data.slots.length > 0) {
                        data.slots.forEach(slot => {
                            const option = document.createElement('option');
                            option.value = slot.time;
                            option.textContent = slot.time;
                            slotSelect.appendChild(option);
                        });
                    } else {
                        const option = document.createElement('option');
                        option.value = "";
                        option.textContent = "No available slots for this date";
                        slotSelect.appendChild(option);
                    }
                })
                .catch(err => {
                    console.error('Error fetching slots:', err);
                    slotSelect.innerHTML = '<option value="">Error loading slots</option>';
                });
        });
    </script>
</body>
</html>
